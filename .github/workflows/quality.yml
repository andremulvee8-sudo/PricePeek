name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Compile-time placeholders only. These are not credentials and the build
    # does not call Supabase, Rainforest, Web Push, or the production website.
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      RAINFOREST_API_KEY: ci-placeholder-not-a-secret
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SECRET_KEY: ci-placeholder-not-a-secret
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-secret
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ci-placeholder-not-a-secret
      VAPID_PRIVATE_KEY: ci-placeholder-not-a-secret
      VAPID_SUBJECT: mailto:ci@example.com
      CRON_SECRET: ci-placeholder-not-a-secret
      RATE_LIMIT_SECRET: ci-placeholder-not-a-secret-that-is-at-least-32-characters
      SUPPORT_EMAIL: support@example.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
